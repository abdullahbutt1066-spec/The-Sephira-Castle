<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bind Device — Sephira Castle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23c4a8ff%22>✦</text></svg>">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f0d14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sephira">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <style>
        :root { --accent: {{ user_color }}; }
        * { box-sizing: border-box; }
        body {
            font-family: Georgia, serif;
            background: color-mix(in srgb, var(--accent) 10%, #0f0d14 90%);
            color: #d8d4e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 50% 40%,
                    color-mix(in srgb, var(--accent) 20%, transparent 80%) 0%,
                    transparent 60%),
                radial-gradient(ellipse at center,
                    transparent 0%,
                    rgba(10, 8, 18, 0.5) 60%,
                    rgba(3, 2, 8, 0.9) 100%);
            pointer-events: none; z-index: 0;
        }
        .card {
            position: relative; z-index: 1;
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--accent) 18%, rgba(20, 18, 30, 0.55)) 0%,
                color-mix(in srgb, var(--accent) 8%, rgba(10, 8, 18, 0.85)) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent 70%);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            padding: 40px 50px;
            width: 340px;
            max-width: 100%;
        }
        h1 { text-align: center; font-size: 1.4em; margin-top: 0; }
        p { color: #b8b0c8; font-size: 0.9em; text-align: center; }
        label { display: block; margin: 14px 0 4px; font-size: 0.9em; color: #9a93a8; }
        input { width: 100%; padding: 10px; background: #14121a; border: 1px solid #3a3450; color: #d8d4e0; border-radius: 4px; font-family: inherit; font-size: 1em; }
        button {
            width: 100%; margin-top: 22px; padding: 12px;
            background: linear-gradient(135deg,
                color-mix(in srgb, var(--accent) 90%, transparent 10%) 0%,
                color-mix(in srgb, var(--accent) 70%, rgba(20, 18, 30, 0.6) 30%) 100%);
            border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent 40%);
            color: #fff; border-radius: 10px; font-size: 1em; cursor: pointer; font-family: inherit;
            box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 30%, transparent 70%);
            transition: filter 0.2s, transform 0.15s;
        }
        button:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .msg { margin-top: 16px; text-align: center; font-size: 0.9em; color: #d18f8f; }
        @media (max-width: 600px) {
            body { padding: 16px; }
            .card { padding: 30px 24px; width: 100%; }
            h1 { font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
    <div class="card">
        <h1>A New Seat at the Table</h1>
        <p>This device is not recognized as belonging to The Fool.<br>To bind it, prove yourself with the recovery password.</p>
        {% if message %}<p class="msg">{{ message }}</p>{% endif %}
        <form method="post">
            <label for="recovery_password">Recovery Password</label>
            <input type="password" id="recovery_password" name="recovery_password" required autofocus>
            <button type="submit">Bind This Device</button>
        </form>
    </div>
</body>
</html>
