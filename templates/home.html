<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Club</title>
    <style>
        :root { --accent: {{ user_color }}; }
        body {
            font-family: Georgia, serif;
            background: color-mix(in srgb, var(--accent) 10%, #0f0d14 90%);
            color: #d8d4e0;
            text-align: center;
            padding: 80px 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 { font-size: 2.5em; margin-bottom: 0.2em; }
        p { color: #b8b0c8; font-size: 1.05em; }
        nav { margin-top: 50px; }
        nav a {
            display: inline-block;
            margin: 10px 12px;
            padding: 14px 32px;
            font-size: 1.05em;
            font-family: inherit;
            text-decoration: none;
            color: #fff;
            background: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 6px;
            transition: filter 0.15s;
        }
        nav a:hover, nav a:focus {
            filter: brightness(1.2);
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }
        nav a.secondary {
            background: transparent;
            color: var(--accent);
            border-color: var(--accent);
        }
        nav a.secondary:hover, nav a.secondary:focus {
            background: color-mix(in srgb, var(--accent) 15%, transparent 85%);
            color: #fff;
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome to the Tarot Club</h1>
        <p>The gathering is not yet in session.</p>

        <nav aria-label="Main navigation">
            <a href="/register">Enter the Club</a>
            <a href="/login" class="secondary">Already a member?</a>
        </nav>
    </main>
</body>
</html>
