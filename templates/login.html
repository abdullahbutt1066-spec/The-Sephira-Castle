<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter — The Sephira Castle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23c4a8ff%22>✦</text></svg>">
    <style>
        :root { --accent: {{ user_color }}; }
        * { box-sizing: border-box; }
        body {
            font-family: Georgia, serif;
            background: color-mix(in srgb, var(--accent) 10%, #0f0d14 90%);
            color: #d8d4e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: color-mix(in srgb, var(--accent) 8%, #1a1724 92%);
            padding: 40px 50px;
            border: 1px solid color-mix(in srgb, var(--accent) 20%, #3a3450 80%);
            border-radius: 8px;
            width: 340px;
            max-width: 100%;
        }
        h1 { text-align: center; font-size: 1.5em; margin-top: 0; }
        label { display: block; margin: 14px 0 4px; font-size: 0.9em; color: #9a93a8; }
        input {
            width: 100%;
            padding: 10px;
            background: #14121a;
            border: 1px solid #3a3450;
            color: #d8d4e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: #fff;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { filter: brightness(1.2); }
        .msg { margin-top: 16px; text-align: center; font-size: 0.9em; color: #d18f8f; }
        .link { text-align: center; margin-top: 20px; font-size: 0.85em; }
        a { color: var(--accent); text-decoration: none; }
        @media (max-width: 600px) {
            body { padding: 16px; }
            .card { padding: 30px 24px; width: 100%; }
            h1 { font-size: 1.3em; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Enter the Castle</h1>
        {% if message %}<p class="msg">{{ message }}</p>{% endif %}
        <form method="post">
            <label for="codename">Codename</label>
            <input type="text" id="codename" name="codename" placeholder="The Fool" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Log In</button>
        </form>
        <p class="link">Not a member? <a href="/register">Register</a></p>
        <p class="link">Forgot your recovery password? <a href="/fool-recover">Recover</a></p>
    </div>
</body>
</html>
