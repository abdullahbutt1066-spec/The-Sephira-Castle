<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Tarot Club</title>
    <style>
        :root { --accent: {{ user_color }}; }
        * { box-sizing: border-box; }
        body {
            font-family: Georgia, serif;
            background: color-mix(in srgb, var(--accent) 10%, #0f0d14 90%);
            color: #d8d4e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: color-mix(in srgb, var(--accent) 8%, #1a1724 92%);
            padding: 40px 50px;
            border: 1px solid color-mix(in srgb, var(--accent) 20%, #3a3450 80%);
            border-radius: 8px;
            width: 340px;
            max-width: 100%;
        }
        h1 { text-align: center; font-size: 1.5em; margin-top: 0; }
        label { display: block; margin: 14px 0 4px; font-size: 0.9em; color: #9a93a8; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #14121a;
            border: 1px solid #3a3450;
            color: #d8d4e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: #fff;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { filter: brightness(1.2); }
        .msg { margin-top: 16px; text-align: center; font-size: 0.9em; }
        .msg.ok  { color: #8fd18f; }
        .msg.err { color: #d18f8f; }
        .hidden { display: none; }
        .hint { font-size: 0.75em; color: #6a6380; margin-top: 4px; }
        .link { text-align: center; margin-top: 20px; font-size: 0.85em; }
        a { color: var(--accent); text-decoration: none; }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .card { padding: 30px 24px; width: 100%; }
            h1 { font-size: 1.3em; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Enter the Tarot Club</h1>

        {% if message %}
            <p class="msg {{ 'ok' if success else 'err' }}">{{ message }}</p>
        {% endif %}

        <form method="post">
            <label for="codename">Codename</label>
            <select id="codename" name="codename" required>
                <option value="" disabled selected>— Choose your card —</option>
                {% for card in cards %}
                    <option value="{{ card }}" {% if card in taken %}disabled{% endif %}>
                        {{ card }}{% if card in taken %} (taken){% endif %}
                    </option>
                {% endfor %}
            </select>

            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <div id="recovery-block" class="hidden">
                <label for="recovery_password">Recovery Password</label>
                <input type="password" id="recovery_password" name="recovery_password">
                <p class="hint">Only The Fool has a recovery password. Choose carefully — it cannot be changed.</p>

                <label for="email">Recovery Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
                <p class="hint">Used only to reset your recovery password. Must be pre-registered.</p>
            </div>

            <button type="submit">Register</button>
        </form>

        <p class="link">Already a member? <a href="/login">Log in</a></p>
    </div>

    <script>
        const codenameSelect = document.getElementById('codename');
        const recoveryBlock = document.getElementById('recovery-block');
        const recoveryInput = document.getElementById('recovery_password');
        const emailInput = document.getElementById('email');

        codenameSelect.addEventListener('change', () => {
            if (codenameSelect.value === 'The Fool') {
                recoveryBlock.classList.remove('hidden');
                recoveryInput.required = true;
                emailInput.required = true;
            } else {
                recoveryBlock.classList.add('hidden');
                recoveryInput.required = false;
                emailInput.required = false;
            }
        });
    </script>
</body>
</html>
