<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Sephira Castle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23c4a8ff%22>✦</text></svg>">
    <style>
        :root { --accent: {{ user_color }}; }
        * { box-sizing: border-box; }
        body {
            font-family: Georgia, serif;
            background: color-mix(in srgb, var(--accent) 10%, #0f0d14 90%);
            color: #d8d4e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .wheel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            height: 900px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.06;
        }
        .wheel span {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 2.5rem;
            color: #d8d4e0;
            line-height: 1;
        }
        .wheel span:nth-child(1)  { transform: translate(-50%, -50%) rotate(0deg)   translateY(-380px) rotate(0deg); }
        .wheel span:nth-child(2)  { transform: translate(-50%, -50%) rotate(16.36deg) translateY(-380px) rotate(-16.36deg); }
        .wheel span:nth-child(3)  { transform: translate(-50%, -50%) rotate(32.73deg) translateY(-380px) rotate(-32.73deg); }
        .wheel span:nth-child(4)  { transform: translate(-50%, -50%) rotate(49.09deg) translateY(-380px) rotate(-49.09deg); }
        .wheel span:nth-child(5)  { transform: translate(-50%, -50%) rotate(65.45deg) translateY(-380px) rotate(-65.45deg); }
        .wheel span:nth-child(6)  { transform: translate(-50%, -50%) rotate(81.82deg) translateY(-380px) rotate(-81.82deg); }
        .wheel span:nth-child(7)  { transform: translate(-50%, -50%) rotate(98.18deg) translateY(-380px) rotate(-98.18deg); }
        .wheel span:nth-child(8)  { transform: translate(-50%, -50%) rotate(114.55deg) translateY(-380px) rotate(-114.55deg); }
        .wheel span:nth-child(9)  { transform: translate(-50%, -50%) rotate(130.91deg) translateY(-380px) rotate(-130.91deg); }
        .wheel span:nth-child(10) { transform: translate(-50%, -50%) rotate(147.27deg) translateY(-380px) rotate(-147.27deg); }
        .wheel span:nth-child(11) { transform: translate(-50%, -50%) rotate(163.64deg) translateY(-380px) rotate(-163.64deg); }
        .wheel span:nth-child(12) { transform: translate(-50%, -50%) rotate(180deg)   translateY(-380px) rotate(-180deg); }
        .wheel span:nth-child(13) { transform: translate(-50%, -50%) rotate(196.36deg) translateY(-380px) rotate(-196.36deg); }
        .wheel span:nth-child(14) { transform: translate(-50%, -50%) rotate(212.73deg) translateY(-380px) rotate(-212.73deg); }
        .wheel span:nth-child(15) { transform: translate(-50%, -50%) rotate(229.09deg) translateY(-380px) rotate(-229.09deg); }
        .wheel span:nth-child(16) { transform: translate(-50%, -50%) rotate(245.45deg) translateY(-380px) rotate(-245.45deg); }
        .wheel span:nth-child(17) { transform: translate(-50%, -50%) rotate(261.82deg) translateY(-380px) rotate(-261.82deg); }
        .wheel span:nth-child(18) { transform: translate(-50%, -50%) rotate(278.18deg) translateY(-380px) rotate(-278.18deg); }
        .wheel span:nth-child(19) { transform: translate(-50%, -50%) rotate(294.55deg) translateY(-380px) rotate(-294.55deg); }
        .wheel span:nth-child(20) { transform: translate(-50%, -50%) rotate(310.91deg) translateY(-380px) rotate(-310.91deg); }
        .wheel span:nth-child(21) { transform: translate(-50%, -50%) rotate(327.27deg) translateY(-380px) rotate(-327.27deg); }
        .wheel span:nth-child(22) { transform: translate(-50%, -50%) rotate(343.64deg) translateY(-380px) rotate(-343.64deg); }
        .card {
            position: relative;
            z-index: 1;
            background: color-mix(in srgb, var(--accent) 8%, #1a1724 92%);
            padding: 40px 50px;
            border: 1px solid color-mix(in srgb, var(--accent) 20%, #3a3450 80%);
            border-radius: 8px;
            width: 340px;
            max-width: 100%;
        }
        h1 { text-align: center; font-size: 1.5em; margin-top: 0; }
        label { display: block; margin: 14px 0 4px; font-size: 0.9em; color: #9a93a8; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #14121a;
            border: 1px solid #3a3450;
            color: #d8d4e0;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: #fff;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { filter: brightness(1.2); }
        .msg { margin-top: 16px; text-align: center; font-size: 0.9em; }
        .msg.ok  { color: #8fd18f; }
        .msg.err { color: #d18f8f; }
        .hidden { display: none; }
        .hint { font-size: 0.75em; color: #6a6380; margin-top: 4px; }
        .link { text-align: center; margin-top: 20px; font-size: 0.85em; }
        a { color: var(--accent); text-decoration: none; }
        @media (max-width: 600px) {
            body { padding: 16px; }
            .wheel { display: none; }
            .card { padding: 30px 24px; width: 100%; }
            h1 { font-size: 1.3em; }
        }
    </style>
</head>
<body>
    <div class="wheel" aria-hidden="true">
        {% for sym in all_symbols %}<span>{{ sym }}</span>{% endfor %}
    </div>
    <div class="card">
        <h1>Enter Sephira Castle</h1>
        {% if message %}<p class="msg {{ 'ok' if success else 'err' }}">{{ message }}</p>{% endif %}
        <form method="post">
            <label for="codename">Codename</label>
            <select id="codename" name="codename" required>
                <option value="" disabled selected>— Choose your card —</option>
                {% for card in cards %}
                    <option value="{{ card }}" {% if card in taken %}disabled{% endif %}>
                        {{ card }}{% if card in taken %} (taken){% endif %}
                    </option>
                {% endfor %}
            </select>
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <div id="recovery-block" class="hidden">
                <label for="recovery_password">Recovery Password</label>
                <input type="password" id="recovery_password" name="recovery_password">
                <p class="hint">Only The Fool has a recovery password. Choose carefully — it cannot be changed.</p>
                <label for="email">Recovery Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
                <p class="hint">Used only to reset your recovery password. Must be pre-registered.</p>
            </div>
            <button type="submit">Register</button>
        </form>
        <p class="link">Already a member? <a href="/login">Log in</a></p>
    </div>
    <script>
        const codenameSelect = document.getElementById('codename');
        const recoveryBlock = document.getElementById('recovery-block');
        const recoveryInput = document.getElementById('recovery_password');
        const emailInput = document.getElementById('email');
        codenameSelect.addEventListener('change', () => {
            if (codenameSelect.value === 'The Fool') {
                recoveryBlock.classList.remove('hidden');
                recoveryInput.required = true;
                emailInput.required = true;
            } else {
                recoveryBlock.classList.add('hidden');
                recoveryInput.required = false;
                emailInput.required = false;
            }
        });
    </script>
</body>
</html>
