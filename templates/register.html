<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register â€” Tarot Club</title>
    <style>
        body {
            font-family: Georgia, serif;
            background: #14121a;
            color: #d8d4e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1b26;
            padding: 40px 50px;
            border: 1px solid #3a3450;
            border-radius: 8px;
            width: 340px;
        }
        h1 { text-align: center; font-size: 1.5em; margin-top: 0; }
        label { display: block; margin: 14px 0 4px; font-size: 0.9em; color: #9a93a8; }
        input, select {
            width: 100%;
            padding: 8px;
            background: #14121a;
            border: 1px solid #3a3450;
            color: #d8d4e0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 10px;
            background: #6a4fa3;
            border: none;
            color: #fff;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover { background: #7d5fc0; }
        .msg { margin-top: 16px; text-align: center; font-size: 0.9em; }
        .msg.ok  { color: #8fd18f; }
        .msg.err { color: #d18f8f; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Enter the Tarot Club</h1>

        {% if message %}
            <p class="msg {{ 'ok' if success else 'err' }}">{{ message }}</p>
        {% endif %}

        <form method="post">
            <label>Codename</label>
            <input type="text" name="codename" placeholder="The Fool" required>

            <label>Gender</label>
            <select name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
